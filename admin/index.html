<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      try {
        if (localStorage.getItem("yigitclub_theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="yigit.club yönetim">
    <title>Yönetim Paneli | yigit.club</title>
    <link rel="stylesheet" href="../css/style.css?v=6">
    <link rel="stylesheet" href="admin.css?v=16">
    <style>
      body { max-width: 1100px; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
    </style>
  </head>
  <body>

    <header>
      <a href="../index.html" class="logo" id="site-logo" aria-label="admin.club">
        <span class="logo-bold"></span><span class="logo-italic"></span><span class="logo-cursor"></span>
      </a>
      <button id="menu-toggle" class="menu-toggle" aria-label="Menü">☰</button>
      <div class="header-right" id="header-right">
        <nav id="site-nav"></nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="Tema değiştir"></button>
      </div>
    </header>

    <div id="admin-root">
      <p style="color:#a1a1aa;">Yükleniyor...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../js/site.js?v=10"></script>
    <script src="admin.js?v=20"></script>
    <script>
      initTheme();
      initLogoTyping("admin.", "club");
      initMobileMenu();
      renderNav("../", "../kategori/");
      initAdmin();
    </script>

  </body>
</html>
