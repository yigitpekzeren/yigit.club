name: Bildirim

# Yalnizca elle calisir: Actions sekmesinden "Run workflow".
#
# Gunluk zamanlama 2026-10-26'da kaldirildi. Test amacini tamamlamisti ve
# her aksam gelen bos bildirim artik ise yaramiyordu.
# Geri istersen asagiya sunu eklemek yeterli:
#   schedule:
#     - cron: "0 18 * * *"
on:
  workflow_dispatch:
    inputs:
      baslik:
        description: "Bildirim basligi (bos birakilirsa varsayilan kullanilir)"
        required: false
        default: ""
      metin:
        description: "Bildirim metni (bos birakilirsa varsayilan kullanilir)"
        required: false
        default: ""

# Bu is depoya yazmiyor, sadece okuyor.
permissions:
  contents: read

# Ust uste tetiklenirse siraya soksun, ayni anda iki bildirim gitmesin.
concurrency:
  group: bildirim
  cancel-in-progress: false

jobs:
  gonder:
    name: Push bildirimi gonder
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: pywebpush yukle
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebpush

      - name: Bildirimi gonder
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_TITLE: ${{ inputs.baslik }}
          PUSH_BODY: ${{ inputs.metin }}
          # Ayni sayfadaki 'Variables' sekmesi. Bunlar dolu ama yukaridaki
          # secret'lar bossa, deger yanlis sekmeye eklenmis demektir; script
          # bunu ayirt edip ne yapilacagini soyluyor.
          VAR_VAPID_PRIVATE_KEY: ${{ vars.VAPID_PRIVATE_KEY }}
          VAR_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          VAR_PUSH_SUBSCRIPTION: ${{ vars.PUSH_SUBSCRIPTION }}
        run: python send_push.py
